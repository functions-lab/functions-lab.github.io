      // reveal-on-scroll
      const io = new IntersectionObserver(
        (entries) => entries.forEach((e) => e.isIntersecting && e.target.classList.add('in')),
        { threshold: 0.08 }
      );
      document.querySelectorAll('.reveal').forEach((el) => io.observe(el));

      // horizontal carousels — arrows cycle (wrap around), custom smooth scroll
      document.querySelectorAll('.carousel-wrap').forEach((wrap) => {
        const track = wrap.querySelector('.carousel-track');
        const prev = wrap.querySelector('.carousel-arrow.left');
        const next = wrap.querySelector('.carousel-arrow.right');
        if (!track) return;
        let timer = null;
        const animateTo = (target) => {
          if (timer) clearInterval(timer);
          const start = track.scrollLeft;
          const dist = target - start;
          const dur = 380;
          const t0 = Date.now();
          const ease = (p) => 1 - Math.pow(1 - p, 3);
          timer = setInterval(() => {
            const p = Math.min((Date.now() - t0) / dur, 1);
            track.scrollLeft = start + dist * ease(p);
            if (p >= 1) { clearInterval(timer); timer = null; }
          }, 16);
        };
        const step = () => Math.min(track.clientWidth * 0.85, 760);
        const maxLeft = () => track.scrollWidth - track.clientWidth;
        next?.addEventListener('click', () => {
          if (track.scrollLeft >= maxLeft() - 8) animateTo(0);
          else animateTo(Math.min(track.scrollLeft + step(), maxLeft()));
        });
        prev?.addEventListener('click', () => {
          if (track.scrollLeft <= 8) animateTo(maxLeft());
          else animateTo(Math.max(track.scrollLeft - step(), 0));
        });
      });
    </script> </body> </html>
